name: One-shot public board read
on:
  push:
    branches: [research/public-board-read-20261117]
    paths: [.github/workflows/public-board-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public source without credentials
        shell: python
        run: |
          import json,subprocess,shutil,tempfile,hashlib,datetime,urllib.parse
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):super().__init__();self.skip=0;self.text=[];self.links=[]
              def handle_starttag(self,t,a):
                  a=dict(a)
                  if t in ("script","style"):self.skip+=1
                  if t=="a" and a.get("href"):self.links.append(a["href"])
              def handle_endtag(self,t):
                  if t in ("script","style"):self.skip=max(0,self.skip-1)
              def handle_data(self,x):
                  if not self.skip and x.strip():self.text.append(x.strip())
          url="https://www.craigslist.org/view/d/san-jose-build-ai-assistant/edts1cxT9n9MPi48VCSmb8"
          row={"url":url,"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"read_only":True,"browser_location":"isolated LinuxCI, no user desktop/profile","http_status_unverified":True}
          try:
              chrome=shutil.which("google-chrome") or shutil.which("chromium")
              if not chrome:raise ValueError("No Chrome executable, not installing one")
              with tempfile.TemporaryDirectory() as profile:
                  r=subprocess.run([chrome,"--headless","--disable-gpu","--user-data-dir="+profile,"--virtual-time-budget=10000","--dump-dom",url],text=True,capture_output=True,timeout=45)
                  if r.returncode:raise ValueError("Chrome exit"+str(r.returncode)+": "+r.stderr[-1200:])
                  p=P();p.feed(r.stdout);row.update(rendered_dom_sha256=hashlib.sha256(r.stdout.encode()).hexdigest(),text="\n".join(p.text)[:24000],links=list(dict.fromkeys(urllib.parse.urljoin(url,x) for x in p.links))[:150])
          except Exception as exc:row["error"]=str(exc)
          print("PUBLIC_SOURCE_CAPTURE "+json.dumps(row,ensure_ascii=False),flush=True)
