name: One-shot public board read
on:
  push:
    branches: [research/public-board-read-20261117]
    paths: [.github/workflows/public-board-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public source without credentials
        shell: python
        run: |
          import urllib.request,urllib.error,json,hashlib,datetime,time
          url="https://hacker-news.firebaseio.com/v0/item/50338728.json"
          row={"url":url,"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"read_only":True,"metadata":[],"items":[],"requests":[]}
          started=time.monotonic()
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Public project research / read-only","Accept":"application/json"}),timeout=8) as response:
                  b=response.read(500001)
                  if len(b)>500000:raise ValueError("Oversize")
                  row["requests"].append({"url":u,"status":response.status,"sha256":hashlib.sha256(b).hexdigest()})
                  return json.loads(b)
          try:
              for ident in [50338728,50338726]:
                  d=get("https://hacker-news.firebaseio.com/v0/item/"+str(ident)+".json")
                  row["metadata"].append({k:d.get(k) for k in ["id","title","time","descendants","text"]})
                  if "freelanc" not in (d.get("title")or"").lower():continue
                  row["thread_id"]=ident
                  row["total_top_level_comments"]=len(d.get("kids",[]))
                  for cid in sorted(d.get("kids",[]),reverse=True)[:15]:
                      if time.monotonic()-started>65:break
                      c=get("https://hacker-news.firebaseio.com/v0/item/"+str(cid)+".json")
                      if c and not c.get("deleted") and not c.get("dead"):row["items"].append({k:c.get(k) for k in ["id","by","time","text","parent","kids"]}|{"source_url":"https://news.ycombinator.com/item?id="+str(cid)})
              row["status"]=200
          except Exception as exc:
              row["error"]=str(exc)
              if isinstance(exc,urllib.error.HTTPError):row["error_status"]=exc.code
          print("PUBLIC_SOURCE_CAPTURE "+json.dumps(row,ensure_ascii=False),flush=True)
