name: One-shot public board read
on:
  push:
    branches: [research/public-board-read-20261117]
    paths: [.github/workflows/public-board-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public source records without credentials
        shell: python
        run: |
          import urllib.request,json,hashlib,datetime
          urls=["https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=bounty&limit=15&sort=latest&since=2026-11-10T00%3A00%3A00Z","https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=%22will%20pay%22%20fix&limit=15&sort=latest&since=2026-11-01T00%3A00%3A00Z","https://api.bountyhub.dev/api/bounties?page=2&limit=15"]
          for url in urls:
              row={"url":url,"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Public project research / read-only","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      raw=response.read(2000001)
                      if len(raw)>2000000: raise ValueError("Response exceeds2MB")
                      data=json.loads(raw.decode("utf-8"))
                      row.update(status=response.status,final_url=response.url,sha256=hashlib.sha256(raw).hexdigest())
                      if isinstance(data,dict) and isinstance(data.get("posts"),list):
                          row["cursor"]=data.get("cursor")
                          row["items"]=[{"source_url":"https://bsky.app/profile/"+p["author"]["handle"]+"/post/"+p["uri"].rsplit("/",1)[-1],"uri":p["uri"],"author":p["author"]["handle"],"text":p.get("record",{}).get("text"),"created_at":p.get("record",{}).get("createdAt"),"indexed_at":p.get("indexedAt"),"reply_count":p.get("replyCount"),"links":[f.get("uri") for a in p.get("record",{}).get("facets",[]) for f in a.get("features",[]) if f.get("uri")]} for p in data["posts"][:15]]
                      elif isinstance(data,dict) and isinstance(data.get("data"),list):
                          keep=("id","title","htmlURL","body","amount","totalAmount","assignmentType","issueState","claimed","solved","retracted","paymentStatus","createdAt","githubCreatedAt","additionalDescription")
                          row["items"]=[{k:p.get(k) for k in keep} for p in data["data"][:15]]
                          row["hasNextPage"]=data.get("hasNextPage")
                      else:
                          row["data"]=data
              except Exception as exc:
                  row["error"]=str(exc)
              print("PUBLIC_SOURCE_CAPTURE "+json.dumps(row,ensure_ascii=False),flush=True)
