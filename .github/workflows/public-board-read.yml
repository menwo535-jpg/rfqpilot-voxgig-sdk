name: One-shot public board read
on:
  push:
    branches: [research/public-board-read-20261117]
    paths: [.github/workflows/public-board-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public source pages without credentials
        shell: python
        run: |
          import urllib.request, json, re, hashlib, datetime
          urls = ["https://api.gitpay.me/tasks", "https://bountyhub.dev/", "https://app.opire.dev/", "https://bounties.monero.social/"]
          for url in urls:
              row = {"url":url, "captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Public project research / read-only","Accept":"application/json,text/html"})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      raw=response.read(2000001)
                      if len(raw)>2000000: raise ValueError("Response exceeds2MB")
                      body=raw.decode("utf-8")
                      row.update(status=response.status,final_url=response.url,sha256=hashlib.sha256(raw).hexdigest())
                      try:
                          data=json.loads(body)
                          rows=data if isinstance(data,list) else next((data[k] for k in ("rows","tasks","data","results") if isinstance(data.get(k),list)),None)
                          if rows is not None:
                              funded=[r for r in rows if isinstance(r,dict) and float(r.get("value") or r.get("amount") or 0)>0]
                              funded.sort(key=lambda r:str(r.get("createdAt") or r.get("created_at") or r.get("id") or ""),reverse=True)
                              row.update(total_rows=len(rows),funded_total=len(funded),rows=funded[:15])
                          else: row["body"]=body[:18000]
                      except (ValueError,TypeError):
                          row["body"]=body[:18000]
              except Exception as exc: row["error"]=str(exc)
              print("PUBLIC_SOURCE_CAPTURE "+json.dumps(row,ensure_ascii=False),flush=True)
