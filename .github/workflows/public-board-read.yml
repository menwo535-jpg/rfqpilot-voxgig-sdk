name: One-shot public board read
on:
  push:
    branches: [research/public-board-read-20261117]
    paths: [.github/workflows/public-board-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read one public source without credentials
        shell: python
        run: |
          import json,subprocess,shutil,tempfile,hashlib,datetime,urllib.request,time
          url="https://www.craigslist.org/view/d/san-jose-build-ai-assistant/edts1cxT9n9MPi48VCSmb8"
          row={"url":url,"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"read_only":True,"browser_location":"isolated LinuxCI, no user desktop/profile","action":"one normal reply disclosure; never send, login or solve a challenge"}
          try:
           chrome=shutil.which("google-chrome") or shutil.which("chromium")
           node=shutil.which("node")
           if not chrome or not node:raise ValueError("Existing Chrome/Node unavailable; no installation")
           with tempfile.TemporaryDirectory() as profile:
            p=subprocess.Popen([chrome,"--headless","--disable-gpu","--user-data-dir="+profile,"--remote-debugging-port=9222",url],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
            try:
             tabs=[]
             for i in range(20):
              try:
               tabs=json.load(urllib.request.urlopen("http://127.0.0.1:9222/json",timeout=1))
               if tabs:break
              except Exception:time.sleep(.5)
             target=next(t for t in tabs if t.get("type")=="page")
             js=r"""const ws=new WebSocket(process.argv[1]);let seq=0;const pending=new Map();
          ws.addEventListener('message',e=>{const v=JSON.parse(e.data);if(pending.has(v.id)){pending.get(v.id)(v);pending.delete(v.id)}});
          const cmd=(method,params={})=>new Promise(resolve=>{const id=++seq;pending.set(id,resolve);ws.send(JSON.stringify({id,method,params}))});
          const val=async expression=>(await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true})).result?.result?.value;
          ws.addEventListener('open',async()=>{try{
           await new Promise(r=>setTimeout(r,6000));
           const before=await val('document.body.innerText');
           if(/captcha|unusual traffic|verify you are human|verification required|blocked|access denied/i.test(before)){console.log(JSON.stringify({text:before,gate:true,clicked:false}));ws.close();return;}
           const clicked=await val("(()=>{const b=[...document.querySelectorAll('button,a')].find(x=>x.textContent.trim()==='reply'&&x.getBoundingClientRect().width>0);if(!b)return false;b.click();return true})()");
           await new Promise(r=>setTimeout(r,5000));
           console.log(JSON.stringify({text:await val('document.body.innerText'),clicked,links:await val('[...document.querySelectorAll("a[href]")].map(a=>a.href).filter(x=>x.startsWith("mailto:"))')}));
           }catch(e){console.log(JSON.stringify({error:String(e)}))}finally{ws.close()}});
          setTimeout(()=>process.exit(2),20000);"""
             r=subprocess.run([node,"--experimental-websocket","-e",js,target["webSocketDebuggerUrl"]],text=True,capture_output=True,timeout=25)
             lines=[x for x in r.stdout.splitlines() if x.startswith("{")]
             if not lines:raise ValueError("Contact disclosure unavailable: "+r.stderr[-800:])
             row.update(json.loads(lines[-1]))
            finally:p.terminate()
          except Exception as e:row["error"]=str(e)
          print("PUBLIC_SOURCE_CAPTURE "+json.dumps(row,ensure_ascii=False),flush=True)
