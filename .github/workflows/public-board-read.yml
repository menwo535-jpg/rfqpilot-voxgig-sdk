name: One-shot public board read
on:
  push:
    branches: [research/public-board-read-20261117]
    paths: [.github/workflows/public-board-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read complete public page text and referenced API hints
        shell: python
        run: |
          import urllib.request, urllib.parse, json, re, hashlib, datetime
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.text=[]; self.links=[]; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ("script","style"): self.skip+=1
                  if tag=="script" and a.get("src"): self.scripts.append(a["src"])
                  if tag=="a" and a.get("href"): self.links.append(a["href"])
              def handle_endtag(self,tag):
                  if tag in ("script","style"): self.skip=max(0,self.skip-1)
              def handle_data(self,data):
                  if not self.skip and data.strip(): self.text.append(data.strip())
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Public project research / read-only","Accept":"text/html,application/json;q=0.9,application/javascript;q=0.8"}),timeout=20) as response:
                  raw=response.read(2000001)
                  if len(raw)>2000000: raise ValueError("Response exceeds2MB")
                  return response.status,response.url,raw
          for url in ("https://www.bountyhub.dev/en/bounties","https://app.opire.dev/api/backend/rewards","https://bounties.monero.social/"):
              row={"url":url,"captured_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  status,final,raw=get(url); body=raw.decode("utf-8"); page=Page(); page.feed(body)
                  try: row["json_text"]=json.dumps(json.loads(body),ensure_ascii=False)[:60000]
                  except ValueError: pass
                  row.update(status=status,final_url=final,sha256=hashlib.sha256(raw).hexdigest(),text="\n".join(page.text)[:20000],links=list(dict.fromkeys(urllib.parse.urljoin(final,x) for x in page.links))[:120])
                  scripts=list(dict.fromkeys(urllib.parse.urljoin(final,x) for x in page.scripts))
                  chosen=[x for x in scripts if urllib.parse.urlsplit(x).netloc==urllib.parse.urlsplit(final).netloc and ("page-" in x or "layout-" in x)]
                  if not chosen: chosen=[x for x in scripts if urllib.parse.urlsplit(x).netloc==urllib.parse.urlsplit(final).netloc][-12:]
                  row["script_hints"]=[]
                  for script in chosen[:12]:
                      hint={"url":script}
                      try:
                          _,_,data=get(script); text=data.decode("utf-8")
                          hits=[text[max(0,m.start()-160):m.end()+240] for m in re.finditer(r"(?:https?://[^\"\\s]+|/api/[A-Za-z0-9_/?=.-]+|bounties|rewards|issueId)",text,re.I)]
                          hint["matches"]=hits[:8]
                      except Exception as exc: hint["error"]=str(exc)
                      row["script_hints"].append(hint)
              except Exception as exc: row["error"]=str(exc)
              print("PUBLIC_SOURCE_CAPTURE "+json.dumps(row,ensure_ascii=False),flush=True)
